<!doctype html>
<html>
<head>
  <title>SakuraStars</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1">
  <link href="styles.css" rel="stylesheet" type="text/css">

  <!-- Socket.IO（Java版と相性いい2系） -->
  <script src="https://cdn.socket.io/2.4.0/socket.io.js"></script>
</head>

<body>
<div align="center" id="embed-html"></div>

<script type="text/javascript" src="html/html.nocache.js"></script>

<script>
  // Socket.IO 接続
  const socket = io("https://sakura-stras.f5.si");

  socket.on("connect", () => {
    console.log("✅ connected to server");
  });

  socket.on("disconnect", () => {
    console.log("❌ disconnected");
  });

  // サーバーからのメッセージ受信（テスト用）
  socket.on("message", (data) => {
    console.log("📩 message:", data);
  });

  // サーバーに送信（テスト）
  function sendMessage() {
    socket.emit("message", "Hello from browser!");
  }

  // クリックで送信テスト
  document.addEventListener("click", sendMessage);
</script>

<script>
var properties = { "root": "" };

function handleMouseDown(evt) {
  evt.preventDefault();
  evt.stopPropagation();
  window.focus();
}

document.addEventListener('contextmenu', event => event.preventDefault());
document.getElementById('embed-html')
  .addEventListener('mousedown', handleMouseDown, false);
</script>

</body>
</html>
